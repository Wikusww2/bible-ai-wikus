name: Improvement proposal
description: Propose an improvement with a clear user or maintenance need.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe who encounters the problem and a concrete example.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include scope, alternatives and any source or licensing requirements.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: How could this be verified?
